<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Flores — Día de la Mujer 🌻</title>
<style>
*,*::after,*::before{padding:0;margin:0;box-sizing:border-box}
:root{--dark-color:#000}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:flex-end;justify-content:center;min-height:100vh;min-height:100dvh;background-color:var(--dark-color);overflow:hidden;perspective:1000px}
.night{position:fixed;left:50%;top:0;transform:translateX(-50%);width:100%;height:100%;filter:blur(0.1vmin);background-image:radial-gradient(ellipse at top,transparent 0%,var(--dark-color)),radial-gradient(ellipse at bottom,var(--dark-color),rgba(145,233,255,0.2)),repeating-linear-gradient(220deg,rgb(0,0,0) 0px,rgb(0,0,0) 19px,transparent 19px,transparent 22px),repeating-linear-gradient(189deg,rgb(0,0,0) 0px,rgb(0,0,0) 19px,transparent 19px,transparent 22px),repeating-linear-gradient(148deg,rgb(0,0,0) 0px,rgb(0,0,0) 19px,transparent 19px,transparent 22px),linear-gradient(90deg,rgb(21,255,0),rgb(240,240,240))}
.flowers{position:relative;transform:scale(0.9)}

/* ── FLORES ORIGINALES ── */
.flower{position:absolute;bottom:10vmin;transform-origin:bottom center;z-index:10;--fl-speed:0.8s}
.flower--1{animation:moving-flower-1 4s linear infinite}
.flower--1 .flower__line{height:70vmin;animation-delay:0.3s}
.flower--1 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 1.6s backwards}
.flower--1 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 1.4s backwards}
.flower--1 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 1.2s backwards}
.flower--1 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 1s backwards}
.flower--1 .flower__line__leaf--5{animation:blooming-leaf-right var(--fl-speed) 1.8s backwards}
.flower--1 .flower__line__leaf--6{animation:blooming-leaf-left var(--fl-speed) 2s backwards}
.flower--2{left:50%;transform:rotate(20deg);animation:moving-flower-2 4s linear infinite}
.flower--2 .flower__line{height:60vmin;animation-delay:0.6s}
.flower--2 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 1.9s backwards}
.flower--2 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 1.7s backwards}
.flower--2 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 1.5s backwards}
.flower--2 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 1.3s backwards}
.flower--3{left:50%;transform:rotate(-15deg);animation:moving-flower-3 4s linear infinite}
.flower--3 .flower__line{animation-delay:0.9s}
.flower--3 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 2.5s backwards}
.flower--3 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 2.3s backwards}
.flower--3 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 2.1s backwards}
.flower--3 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 1.9s backwards}
.flower__leafs{position:relative;animation:blooming-flower 2s backwards}
.flower__leafs--1{animation-delay:1.1s}
.flower__leafs--2{animation-delay:1.4s}
.flower__leafs--3{animation-delay:1.7s}
.flower__leafs::after{content:"";position:absolute;left:0;top:0;transform:translate(-50%,-100%);width:8vmin;height:8vmin;background-color:#1aaa15;filter:blur(10vmin)}
.flower__leaf{position:absolute;bottom:0;left:50%;width:8vmin;height:11vmin;border-radius:51% 49% 47% 53%/44% 45% 55% 69%;background-color:#1aaa15;background-image:linear-gradient(to top,#fce700,#fce700);transform-origin:bottom center;opacity:0.9;box-shadow:inset 0 0 2vmin rgba(255,255,255,0.5)}
.flower__leaf--1{transform:translate(-10%,1%) rotateY(40deg) rotateX(-50deg)}
.flower__leaf--2{transform:translate(-50%,-4%) rotateX(40deg)}
.flower__leaf--3{transform:translate(-90%,0%) rotateY(45deg) rotateX(50deg)}
.flower__leaf--4{width:8vmin;height:8vmin;transform-origin:bottom left;border-radius:4vmin 10vmin 4vmin 4vmin;transform:translate(0%,18%) rotateX(70deg) rotate(-43deg);background-image:linear-gradient(to top,#fce700,#fce700);z-index:1;opacity:0.8}
.flower__white-circle{position:absolute;left:-3.5vmin;top:-3vmin;width:9vmin;height:4vmin;border-radius:50%;background-color:#fff}
.flower__white-circle::after{content:"";position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:60%;height:60%;border-radius:inherit;background-image:linear-gradient(90deg,rgb(190,133,0),rgb(190,133,0))}
.flower__line{height:55vmin;width:1.5vmin;background-image:linear-gradient(to left,rgba(0,0,0,0.2),transparent,rgba(255,255,255,0.2)),linear-gradient(to top,transparent 10%,#064600,#064600);box-shadow:inset 0 0 2px rgba(0,0,0,0.5);animation:grow-flower-tree 4s backwards}
.flower__line__leaf{--w:7vmin;--h:calc(var(--w) + 2vmin);position:absolute;top:20%;left:90%;width:var(--w);height:var(--h);border-top-right-radius:var(--h);border-bottom-left-radius:var(--h);background-image:linear-gradient(to top,rgba(20,122,20,0.4),#1aaa15)}
.flower__line__leaf--1{transform:rotate(70deg) rotateY(30deg)}
.flower__line__leaf--2{top:45%;transform:rotate(70deg) rotateY(30deg)}
.flower__line__leaf--3,.flower__line__leaf--4,.flower__line__leaf--6{border-top-right-radius:0;border-bottom-left-radius:0;border-top-left-radius:var(--h);border-bottom-right-radius:var(--h);left:-460%;top:12%;transform:rotate(-70deg) rotateY(30deg)}
.flower__line__leaf--4{top:40%}
.flower__line__leaf--5{top:0;transform-origin:left;transform:rotate(70deg) rotateY(30deg) scale(0.6)}
.flower__line__leaf--6{top:-2%;left:-450%;transform-origin:right;transform:rotate(-70deg) rotateY(30deg) scale(0.6)}
.flower__light{position:absolute;bottom:0;width:1vmin;height:1vmin;background-color:rgb(255,251,0);border-radius:50%;filter:blur(0.2vmin);animation:light-ans 4s linear infinite backwards}
.flower__light:nth-child(odd){background-color:#fce700}
.flower__light--1{left:-2vmin;animation-delay:1s}.flower__light--2{left:3vmin;animation-delay:0.5s}.flower__light--3{left:-6vmin;animation-delay:0.3s}.flower__light--4{left:6vmin;animation-delay:0.9s}.flower__light--5{left:-1vmin;animation-delay:1.5s}.flower__light--6{left:-4vmin;animation-delay:3s}.flower__light--7{left:3vmin;animation-delay:2s}.flower__light--8{left:-6vmin;animation-delay:3.5s}

/* ── TULIPANES ── */
.tulip{position:absolute;bottom:10vmin;transform-origin:bottom center;z-index:10}
.tulip--1{left:-22vmin;transform:rotate(-22deg);animation:moving-flower-3 4.5s 0.3s linear infinite}
.tulip--1 .tulip__line{height:52vmin;animation-delay:1.0s}
.tulip--1 .tulip__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 2.2s backwards}
.tulip--1 .tulip__line__leaf--2{animation:blooming-leaf-left var(--fl-speed) 2.0s backwards}
.tulip--2{left:50%;transform:rotate(25deg);animation:moving-flower-2 4.2s 0.5s linear infinite}
.tulip--2 .tulip__line{height:58vmin;animation-delay:1.3s}
.tulip--2 .tulip__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 2.6s backwards}
.tulip--2 .tulip__line__leaf--2{animation:blooming-leaf-left var(--fl-speed) 2.4s backwards}
.tulip--3{left:22vmin;transform:rotate(8deg);animation:moving-flower-1 3.8s 0.7s linear infinite}
.tulip--3 .tulip__line{height:48vmin;animation-delay:1.6s}
.tulip--3 .tulip__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 2.9s backwards}
.tulip--3 .tulip__line__leaf--2{animation:blooming-leaf-left var(--fl-speed) 2.7s backwards}
.tulip__line{width:1.5vmin;background-image:linear-gradient(to left,rgba(0,0,0,0.2),transparent,rgba(255,255,255,0.2)),linear-gradient(to top,transparent 10%,#064600,#1aaa15);box-shadow:inset 0 0 2px rgba(0,0,0,0.5);animation:grow-flower-tree 4s backwards}
.tulip__line__leaf{--w:9vmin;--h:calc(var(--w) + 5vmin);position:absolute;top:30%;left:90%;width:var(--w);height:var(--h);border-top-right-radius:var(--h);border-bottom-left-radius:var(--h);background-image:linear-gradient(to top,rgba(20,122,20,0.4),#1aaa15)}
.tulip__line__leaf--1{transform:rotate(65deg) rotateY(30deg)}
.tulip__line__leaf--2{border-top-right-radius:0;border-bottom-left-radius:0;border-top-left-radius:var(--h);border-bottom-right-radius:var(--h);left:-550%;top:50%;transform:rotate(-65deg) rotateY(30deg)}
.tulip__head{position:relative;animation:blooming-flower 2s backwards}
.tulip--1 .tulip__head{animation-delay:1.8s}
.tulip--2 .tulip__head{animation-delay:2.1s}
.tulip--3 .tulip__head{animation-delay:2.4s}
.tulip__head::after{content:"";position:absolute;left:0;top:0;transform:translate(-50%,-80%);width:10vmin;height:10vmin;background-color:#fce700;filter:blur(12vmin)}
.tulip__petal{position:absolute;bottom:0;left:50%;width:7vmin;height:12vmin;transform-origin:bottom center;background-image:linear-gradient(to top,#e6c200,#fce700,#fff5a0);border-radius:50% 50% 30% 30%/60% 60% 40% 40%;opacity:0.95;box-shadow:inset 0 0 1.5vmin rgba(255,255,255,0.4)}
.tulip__petal--1{transform:translate(-50%,0%) rotateY(0deg) rotateX(-15deg)}
.tulip__petal--2{transform:translate(-90%,5%) rotateY(-45deg) rotateX(-20deg)}
.tulip__petal--3{transform:translate(-10%,5%) rotateY(45deg) rotateX(-20deg)}
.tulip__petal--4{transform:translate(-70%,8%) rotateY(-60deg) rotateX(-10deg) scale(0.9);opacity:0.8}
.tulip__petal--5{transform:translate(-30%,8%) rotateY(60deg) rotateX(-10deg) scale(0.9);opacity:0.8}
.tulip__pistil{position:absolute;left:50%;bottom:8vmin;transform:translateX(-50%);width:1.2vmin;height:4vmin;background:linear-gradient(to top,#b8860b,#ffd700);border-radius:50% 50% 0 0;z-index:5}
.tulip__light{position:absolute;bottom:0;width:0.8vmin;height:0.8vmin;background-color:#fce700;border-radius:50%;filter:blur(0.2vmin);animation:light-ans 5s linear infinite backwards}
.tulip__light--1{left:-2vmin;animation-delay:2s}.tulip__light--2{left:2vmin;animation-delay:3s}.tulip__light--3{left:-4vmin;animation-delay:4s}.tulip__light--4{left:4vmin;animation-delay:1.5s}

/* ── PASTO ── */
.flower__grass{--c:#00b815;--line-w:1.5vmin;position:absolute;bottom:12vmin;left:-7vmin;display:flex;flex-direction:column;align-items:flex-end;z-index:20;transform-origin:bottom center;transform:rotate(-48deg) rotateY(40deg)}
.flower__grass--1{animation:moving-grass 2s linear infinite}
.flower__grass--2{left:2vmin;bottom:10vmin;transform:scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);opacity:0.8;z-index:0;animation:moving-grass--2 1.5s linear infinite}
.flower__grass--top{width:7vmin;height:10vmin;border-top-right-radius:100%;border-right:var(--line-w) solid var(--c);transform-origin:bottom center;transform:rotate(-2deg)}
.flower__grass--bottom{margin-top:-2px;width:var(--line-w);height:25vmin;background-image:linear-gradient(to top,transparent,var(--c))}
.flower__grass__leaf{--size:10vmin;position:absolute;width:calc(var(--size)*2.1);height:var(--size);border-top-left-radius:var(--size);border-top-right-radius:var(--size);background-image:linear-gradient(to top,transparent,transparent 30%,var(--c));z-index:100}
.flower__grass__leaf--1{top:-6%;left:30%;--size:6vmin;transform:rotate(-20deg);animation:growing-grass-ans--1 2s 2.6s backwards}
.flower__grass__leaf--2{top:-5%;left:-110%;--size:6vmin;transform:rotate(10deg);animation:growing-grass-ans--2 2s 2.4s linear backwards}
.flower__grass__leaf--3{top:5%;left:60%;--size:8vmin;transform:rotate(-18deg) rotateX(-20deg);animation:growing-grass-ans--3 2s 2.2s linear backwards}
.flower__grass__leaf--4{top:6%;left:-135%;--size:8vmin;transform:rotate(2deg);animation:growing-grass-ans--4 2s 2s linear backwards}
.flower__grass__leaf--5{top:20%;left:60%;--size:10vmin;transform:rotate(-24deg) rotateX(-20deg);animation:growing-grass-ans--5 2s 1.8s linear backwards}
.flower__grass__leaf--6{top:22%;left:-180%;--size:10vmin;transform:rotate(10deg);animation:growing-grass-ans--6 2s 1.6s linear backwards}
.flower__grass__leaf--7{top:39%;left:70%;--size:10vmin;transform:rotate(-10deg);animation:growing-grass-ans--7 2s 1.4s linear backwards}
.flower__grass__leaf--8{top:40%;left:-215%;--size:11vmin;transform:rotate(10deg);animation:growing-grass-ans--8 2s 1.2s linear backwards}
.flower__grass__overlay{position:absolute;top:-10%;right:0%;width:100%;height:100%;background-color:rgba(0,0,0,0.6);filter:blur(1.5vmin);z-index:100}
.flower__g-long{--w:2vmin;--h:6vmin;--c:#1aaa15;position:absolute;bottom:10vmin;left:-3vmin;transform-origin:bottom center;transform:rotate(-30deg) rotateY(-20deg);display:flex;flex-direction:column;align-items:flex-end;animation:flower-g-long-ans 3s linear infinite}
.flower__g-long__top{top:calc(var(--h)*-1);width:calc(var(--w)+1vmin);height:var(--h);border-top-right-radius:100%;border-right:0.7vmin solid var(--c);transform:translate(-0.7vmin,1vmin)}
.flower__g-long__bottom{width:var(--w);height:50vmin;transform-origin:bottom center;background-image:linear-gradient(to top,transparent 30%,var(--c));box-shadow:inset 0 0 2px rgba(0,0,0,0.5);clip-path:polygon(35% 0,65% 1%,100% 100%,0% 100%)}
.flower__g-right{position:absolute;bottom:6vmin;left:-2vmin;transform-origin:bottom left;transform:rotate(20deg)}
.flower__g-right .leaf{width:30vmin;height:50vmin;border-top-left-radius:100%;border-left:2vmin solid #00b815;background-image:linear-gradient(to bottom,transparent,var(--dark-color) 60%);-webkit-mask-image:linear-gradient(to top,transparent 30%,#00b815 60%)}
.flower__g-right--1{animation:flower-g-right-ans 2.5s linear infinite}
.flower__g-right--2{left:5vmin;transform:rotateY(-180deg);animation:flower-g-right-ans--2 3s linear infinite}
.flower__g-right--2 .leaf{height:75vmin;filter:blur(0.3vmin);opacity:0.8}
.flower__g-front{position:absolute;bottom:6vmin;left:2.5vmin;z-index:100;transform-origin:bottom center;transform:rotate(-28deg) rotateY(30deg) scale(1.04);animation:flower__g-front-ans 2s linear infinite}
.flower__g-front__line{width:0.3vmin;height:20vmin;background-image:linear-gradient(to top,transparent,#00b815,transparent 100%);position:relative}
.flower__g-front__leaf-wrapper{position:absolute;top:0;left:0;transform-origin:bottom left;transform:rotate(10deg)}
.flower__g-front__leaf-wrapper:nth-child(even){left:0vmin;transform:rotateY(-180deg) rotate(5deg);animation:flower__g-front__leaf-left-ans 1s ease-in backwards}
.flower__g-front__leaf-wrapper:nth-child(odd){animation:flower__g-front__leaf-ans 1s ease-in backwards}
.flower__g-front__leaf-wrapper--1{top:-8vmin;transform:scale(0.7);animation:flower__g-front__leaf-ans 1s 5.5s ease-in backwards !important}
.flower__g-front__leaf-wrapper--2{top:-8vmin;transform:rotateY(-180deg) scale(0.7) !important;animation:flower__g-front__leaf-left-ans-2 1s 4.6s ease-in backwards !important}
.flower__g-front__leaf-wrapper--3{top:-3vmin;animation:flower__g-front__leaf-ans 1s 4.6s ease-in backwards}
.flower__g-front__leaf-wrapper--4{top:-3vmin;transform:rotateY(-180deg) scale(0.9) !important;animation:flower__g-front__leaf-left-ans-2 1s 4.6s ease-in backwards !important}
.flower__g-front__leaf-wrapper--5,.flower__g-front__leaf-wrapper--6{top:2vmin}
.flower__g-front__leaf-wrapper--7,.flower__g-front__leaf-wrapper--8{top:6.5vmin}
.flower__g-front__leaf-wrapper--2{animation-delay:5.2s !important}.flower__g-front__leaf-wrapper--3{animation-delay:4.9s !important}.flower__g-front__leaf-wrapper--5{animation-delay:4.3s !important}.flower__g-front__leaf-wrapper--6{animation-delay:4.1s !important}.flower__g-front__leaf-wrapper--7{animation-delay:3.8s !important}.flower__g-front__leaf-wrapper--8{animation-delay:3.5s !important}
.flower__g-front__leaf{width:10vmin;height:10vmin;border-radius:100% 0% 0% 100%/100% 100% 0% 0%;box-shadow:inset 0 2px 1vmin hsla(184deg,97%,58%,0.2);background-image:linear-gradient(to bottom left,transparent,var(--dark-color)),linear-gradient(to bottom right,#00b815 50%,transparent 50%,transparent);-webkit-mask-image:linear-gradient(to bottom right,#00b815 50%,transparent 50%,transparent)}
.flower__g-fr{position:absolute;bottom:-4vmin;left:0vmin;transform-origin:bottom left;z-index:10;animation:flower__g-fr-ans 2s linear infinite}
.flower__g-fr .leaf{width:30vmin;height:50vmin;border-top-left-radius:100%;border-left:2vmin solid #00b815;-webkit-mask-image:linear-gradient(to top,transparent 25%,#00b815 50%);position:relative;z-index:1}
.flower__g-fr__leaf{position:absolute;top:0;left:0;width:10vmin;height:10vmin;border-radius:100% 0% 0% 100%/100% 100% 0% 0%;box-shadow:inset 0 2px 1vmin hsla(184deg,97%,58%,0.2);background-image:linear-gradient(to bottom left,transparent,var(--dark-color) 98%),linear-gradient(to bottom right,#00b815 45%,transparent 50%,transparent);-webkit-mask-image:linear-gradient(135deg,#00b815 40%,transparent 50%,transparent)}
.flower__g-fr__leaf--1{left:20vmin;transform:rotate(45deg);animation:flower__g-fr-leaft-ans-1 0.5s 5.2s linear backwards}
.flower__g-fr__leaf--2{left:12vmin;top:-7vmin;transform:rotate(25deg) rotateY(-180deg);animation:flower__g-fr-leaft-ans-6 0.5s 5s linear backwards}
.flower__g-fr__leaf--3{left:15vmin;top:6vmin;transform:rotate(55deg);animation:flower__g-fr-leaft-ans-5 0.5s 4.8s linear backwards}
.flower__g-fr__leaf--4{left:6vmin;top:-2vmin;transform:rotate(25deg) rotateY(-180deg);animation:flower__g-fr-leaft-ans-6 0.5s 4.6s linear backwards}
.flower__g-fr__leaf--5{left:10vmin;top:14vmin;transform:rotate(55deg);animation:flower__g-fr-leaft-ans-5 0.5s 4.4s linear backwards}
.flower__g-fr__leaf--6{left:0vmin;top:6vmin;transform:rotate(25deg) rotateY(-180deg);animation:flower__g-fr-leaft-ans-6 0.5s 4.2s linear backwards}
.flower__g-fr__leaf--7{left:5vmin;top:22vmin;transform:rotate(45deg);animation:flower__g-fr-leaft-ans-7 0.5s 4s linear backwards}
.flower__g-fr__leaf--8{left:-4vmin;top:15vmin;transform:rotate(15deg) rotateY(-180deg);animation:flower__g-fr-leaft-ans-8 0.5s 3.8s linear backwards}
.long-g{position:absolute;bottom:25vmin;left:-42vmin;transform-origin:bottom left}
.long-g--1{bottom:0vmin;transform:scale(0.8) rotate(-5deg)}
.long-g--1 .leaf{-webkit-mask-image:linear-gradient(to top,transparent 40%,#00b815 80%) !important}
.long-g--1 .leaf--1{--w:5vmin;--h:60vmin;left:-2vmin;transform:rotate(3deg) rotateY(-180deg)}
.long-g--2,.long-g--3{bottom:-3vmin;left:-35vmin;transform-origin:center;transform:scale(0.6) rotateX(60deg)}
.long-g--2 .leaf,.long-g--3 .leaf{-webkit-mask-image:linear-gradient(to top,transparent 50%,#00b815 80%) !important}
.long-g--2 .leaf--1,.long-g--3 .leaf--1{left:-1vmin;transform:rotateY(-180deg)}
.long-g--3{left:-17vmin;bottom:0vmin}
.long-g--4{left:25vmin;bottom:-3vmin;transform-origin:center;transform:scale(0.6) rotateX(60deg)}
.long-g--4 .leaf{-webkit-mask-image:linear-gradient(to top,transparent 50%,#00b815 80%) !important}
.long-g--5{left:42vmin;bottom:0vmin;transform:scale(0.8) rotate(2deg)}
.long-g--6{left:0vmin;bottom:-20vmin;z-index:100;filter:blur(0.3vmin);transform:scale(0.8) rotate(2deg)}
.long-g--7{left:35vmin;bottom:20vmin;z-index:-1;filter:blur(0.3vmin);transform:scale(0.6) rotate(2deg);opacity:0.7}
.long-g .leaf{--w:15vmin;--h:40vmin;--c:#1aaa15;position:absolute;bottom:0;width:var(--w);height:var(--h);border-top-left-radius:100%;border-left:2vmin solid var(--c);-webkit-mask-image:linear-gradient(to top,transparent 20%,var(--dark-color));transform-origin:bottom center}
.long-g .leaf--0{left:2vmin;animation:leaf-ans-1 4s linear infinite}
.long-g .leaf--1{--w:5vmin;--h:60vmin;animation:leaf-ans-1 4s linear infinite}
.long-g .leaf--2{--w:10vmin;--h:40vmin;left:-0.5vmin;bottom:5vmin;transform-origin:bottom left;transform:rotateY(-180deg);animation:leaf-ans-2 3s linear infinite}
.long-g .leaf--3{--w:5vmin;--h:30vmin;left:-1vmin;bottom:3.2vmin;transform-origin:bottom left;transform:rotate(-10deg) rotateY(-180deg);animation:leaf-ans-3 3s linear infinite}
.grow-ans{animation:grow-ans 2s var(--d) backwards}
.growing-grass{animation:growing-grass-ans 1s 2s backwards}

/* ── PÉTALOS CAYENDO ── */
.petal{position:absolute;width:2.5vmin;height:2vmin;border-radius:50% 0 50% 0;background:linear-gradient(135deg,#fce700,#ffaa00);opacity:0;z-index:200;pointer-events:none}
@keyframes petal-fall-1{0%{opacity:0;transform:translate(0,0) rotate(0deg)}10%{opacity:0.85}100%{opacity:0;transform:translate(-8vmin,55vmin) rotate(280deg)}}
